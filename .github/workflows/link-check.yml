name: Monthly link check

on:
  schedule:
    - cron: "17 14 1 * *"   # 1st of each month, 14:17 UTC (about 9am Central)
  workflow_dispatch:         # run any time from the Actions tab

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every link
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_links.py || true

      - name: Open or update the link-check issue
        if: steps.check.outputs.broken == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create link-check --color D93F0B --description "Found by the monthly link check" 2>/dev/null || true
          existing=$(gh issue list --label link-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file link-report.md
          else
            gh issue create --title "Links need attention ($(date -u +%Y-%m))" --label link-check --body-file link-report.md
          fi

      - name: Close the issue when everything passes
        if: steps.check.outputs.broken == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(gh issue list --label link-check --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "All links passed the $(date -u +%Y-%m-%d) check."
          done
